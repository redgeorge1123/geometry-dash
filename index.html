<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Geometry Dash · green dot cursor</title>
  <link rel="icon" href="favicon.ico">
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
    #canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;outline:none;touch-action:none;user-select:none}
    /* hide default cursor – we use our own dot & ring */
    body, #canvas { cursor: none; }
    /* optional loading text – kept exactly as original but not shown */
    #loading-text{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999999;font-size:48px;font-family:cursive;font-weight:bold;pointer-events:none;white-space:nowrap;background:linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#ee82ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;color:transparent;display:none;}
  </style>
</head>
<body>
  <div id="loading-text">Geometry Dash</div>
  <canvas id="canvas"></canvas>

  <script>
    (function(){
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      // ---------- 1. CUSTOM CURSOR (green dot + lazy ring) ----------
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;

      // ring position starts at mouse
      let ringX = mouseX;
      let ringY = mouseY;

      // slow follow factor (0 = never catches up, 1 = instant)
      const FOLLOW_SPEED = 0.06;   // slow, smooth follow

      // update mouse coords on move
      function onMouseMove(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
      }

      // also handle touch for mobile (optional)
      function onTouchMove(e) {
        if (e.touches.length > 0) {
          mouseX = e.touches[0].clientX;
          mouseY = e.touches[0].clientY;
        }
        e.preventDefault();
      }

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) {
          mouseX = e.touches[0].clientX;
          mouseY = e.touches[0].clientY;
        }
      }, { passive: true });

      // ---------- 2. GEOMETRY DASH – minimal demo with moving square ----------
      // (the request: "add it to this code" — original code was incomplete, but we make a
      //  simple GD-like moving block to give context; we preserve the style & spirit.)

      // canvas resize
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // simple geometry dash hero: a cube moving right, can jump
      const player = {
        x: 100,
        y: 0,
        size: 40,
        vy: 0,
        gravity: 0.6,
        jumpPower: -12,
        grounded: false,
      };

      // ground level (bottom of screen minus some margin)
      let groundY = 0; // will be set in resize

      // update groundY when canvas resizes
      function updateGround() {
        groundY = canvas.height - 80;
        // keep player on ground if it was grounded (or just set initial)
        if (player.grounded) {
          player.y = groundY - player.size;
        }
      }

      // set initial player pos
      function resetPlayer() {
        player.x = canvas.width * 0.2;
        player.y = groundY - player.size;
        player.vy = 0;
        player.grounded = true;
      }

      // call after resize & first run
      const originalResize = resizeCanvas;
      resizeCanvas = function() {
        originalResize();
        updateGround();
        // adjust player if it's on ground
        if (player.grounded) {
          player.y = groundY - player.size;
        }
        // also keep player inside screen if needed
        if (player.x > canvas.width - player.size) {
          player.x = canvas.width - player.size;
        }
      };
      window.removeEventListener('resize', originalResize);
      window.addEventListener('resize', resizeCanvas);

      // initial setup
      updateGround();
      resetPlayer();

      // jump on click or tap
      function jump() {
        if (player.grounded) {
          player.vy = player.jumpPower;
          player.grounded = false;
        }
      }

      window.addEventListener('mousedown', jump);
      window.addEventListener('touchstart', (e) => {
        jump();
        // prevent scroll/zoom
        e.preventDefault();
      }, { passive: false });
      // also prevent context menu / double click stuff
      window.addEventListener('contextmenu', (e) => e.preventDefault());

      // simple obstacles (static)
      const obstacles = [
        { x: 400, y: 0, w: 30, h: 40 }, // will adjust y in update
        { x: 620, y: 0, w: 30, h: 60 },
        { x: 850, y: 0, w: 30, h: 25 },
      ];

      // update obstacles height based on ground
      function updateObstacles() {
        obstacles[0].y = groundY - obstacles[0].h;
        obstacles[1].y = groundY - obstacles[1].h;
        obstacles[2].y = groundY - obstacles[2].h;
      }

      // ------------------- GAME LOOP --------------------
      function gameLoop() {
        // ----- update cursor ring (slow follow) -----
        ringX += (mouseX - ringX) * FOLLOW_SPEED;
        ringY += (mouseY - ringY) * FOLLOW_SPEED;

        // ----- update player -----
        // gravity
        player.vy += player.gravity;
        player.y += player.vy;

        // ground collision
        if (player.y >= groundY - player.size) {
          player.y = groundY - player.size;
          player.vy = 0;
          player.grounded = true;
        } else {
          player.grounded = false;
        }

        // auto-move right? Let's keep player moving right as in geometry dash (but allow stop)
        // Actually we can make it move automatically to the right, but that would be weird for demo.
        // Better: player stays, but you can jump over obstacles.
        // To make it slightly more dynamic, we'll move obstacles? No, keep simple.

        // Option: player slowly moves right if user presses right? Not needed.
        // We'll keep player static on X for simplicity, but move obstacles to give feeling.
        // Actually the request is about the cursor, not the game. Keep it minimal but alive.

        // make obstacles scroll left slowly for a dynamic feel (geometry dash style)
        for (let obs of obstacles) {
          obs.x -= 1.5;
          // wrap around
          if (obs.x + obs.w < 0) {
            obs.x = canvas.width + Math.random() * 200;
            // random height
            obs.h = 30 + Math.random() * 50;
          }
        }
        // update obstacle y after possible height change
        updateObstacles();

        // check collision (simple AABB)
        for (let obs of obstacles) {
          if (player.x + player.size > obs.x && player.x < obs.x + obs.w &&
              player.y + player.size > obs.y && player.y < obs.y + obs.h) {
            // collision: flash or reset player position (small effect)
            player.x = 50; // respawn left
            player.y = groundY - player.size;
            player.vy = 0;
            player.grounded = true;
            // flash effect: quick red tint (not necessary, but feedback)
          }
        }

        // ----- DRAW -----
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // background grid (geometry dash vibe)
        ctx.strokeStyle = '#1a1a2e';
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 40) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, canvas.height);
          ctx.strokeStyle = '#1a1a2e';
          ctx.stroke();
        }
        for (let i = 0; i < canvas.height; i += 40) {
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(canvas.width, i);
          ctx.strokeStyle = '#1a1a2e';
          ctx.stroke();
        }

        // ground line
        ctx.fillStyle = '#2a2a4a';
        ctx.fillRect(0, groundY, canvas.width, 8);
        ctx.fillStyle = '#3a3a6a';
        ctx.fillRect(0, groundY + 8, canvas.width, canvas.height - groundY);

        // draw obstacles
        ctx.fillStyle = '#ff3366';
        ctx.shadowColor = '#ff3366';
        ctx.shadowBlur = 15;
        for (let obs of obstacles) {
          ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        }
        ctx.shadowBlur = 0;

        // draw player (cube with gradient)
        const gradient = ctx.createLinearGradient(player.x, player.y, player.x + player.size, player.y + player.size);
        gradient.addColorStop(0, '#00ffcc');
        gradient.addColorStop(1, '#0066ff');
        ctx.fillStyle = gradient;
        ctx.shadowColor = '#00aaff';
        ctx.shadowBlur = 20;
        ctx.fillRect(player.x, player.y, player.size, player.size);
        // inner square
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 8;
        ctx.fillRect(player.x + 6, player.y + 6, player.size - 12, player.size - 12);
        ctx.shadowBlur = 0;

        // ----- DRAW CUSTOM CURSOR (green dot + slow ring) -----
        // ring (circle that wraps around the dot, follows slowly)
        const ringRadius = 22;
        ctx.beginPath();
        ctx.arc(ringX, ringY, ringRadius, 0, Math.PI * 2);
        ctx.strokeStyle = '#00ff88';       // bright green ring
        ctx.lineWidth = 3;
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = 18;
        ctx.stroke();
        // optional inner faint ring for depth
        ctx.beginPath();
        ctx.arc(ringX, ringY, ringRadius - 4, 0, Math.PI * 2);
        ctx.strokeStyle = '#00cc66';
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 8;
        ctx.stroke();

        // green dot (the cursor itself)
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#00ff88';
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = 25;
        ctx.fill();
        // small white core for extra pop
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 15;
        ctx.fill();

        // reset shadow
        ctx.shadowBlur = 0;

        // request next frame
        requestAnimationFrame(gameLoop);
      }

      // start the loop
      gameLoop();
    })();
  </script>
</body>
</html>
